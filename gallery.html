  <link rel="icon" href="favicon.ico" type="image/x-icon">

  <style>
    :root {
      --bg-start: #C9A163;
      --bg-end: #F5D7A2;
      --text-main: #222;
      --text-light: #fff;
      --card-bg: rgba(200, 160, 120, 0.2);
      --header-bg: rgba(80, 60, 40, 0.95);
      --border-color: rgba(0, 0, 0, 0.15);
    }

    body {
      background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
      color: var(--text-main);
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      line-height: 1.6;
      min-height: 100vh;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 0 15px;
      background: transparent;
    }

    header {
      background: var(--header-bg);
      color: var(--text-light);
      padding: 1rem 0;
    }

    nav ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    nav a {
      color: var(--text-light);
      text-decoration: none;
      font-weight: bold;
      padding: 5px 10px;
      border-radius: 4px;
    }

    nav a:hover, nav a.active {
      background: rgba(255, 255, 255, 0.2);
    }

    h1, h2, h3 {
      color: #1a1a1a;
    }

    .center-title {
      text-align: center;
      margin-bottom: 2rem;
    }

    /* Сетка галереи */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 3rem;
    }

    .gallery-item img {
      width: 100%;
      height: auto;
      border-radius: 6px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
      cursor: pointer;
      transition: transform 0.2s;
    }

    .gallery-item img:hover {
      transform: scale(1.02);
    }

    .gallery-caption {
      margin-top: 8px;
      text-align: center;
      font-size: 0.9rem;
      color: #333;
    }

    footer {
      background: rgba(40, 30, 20, 0.9);
      color: var(--text-light);
      padding: 1.5rem 0;
      text-align: center;
      margin-top: 3rem;
    }

    /* --- ЛАЙТБОКС (всплывающее окно) --- */
    .lightbox-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      overflow: hidden;
    }

    .lightbox-img {
      max-width: 90%;
      max-height: 90vh;
      border-radius: 4px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
      object-fit: contain;
    }

    .close-lightbox {
      position: absolute;
      top: 20px;
      right: 20px;
      color: white;
      font-size: 2.5rem;
      cursor: pointer;
      text-decoration: none;
      line-height: 1;
      z-index: 10000;
    }

    @media (max-width: 768px) {
      .gallery-grid {
        grid-template-columns: 1fr;
      }
    }
   </style>
<link rel="icon" href="logo.jpg" type="image/jpeg">
</head>

  <!-- Скрипт лайтбокса -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const overlay = document.querySelector('.lightbox-overlay');
      const lightboxImg = overlay.querySelector('.lightbox-img');

      // Открытие лайтбокса при клике на превью
      document.querySelectorAll('.gallery-item img').forEach(img => {
        img.addEventListener('click', (e) => {
          e.preventDefault();
          const fullSrc = img.dataset.full;
          if (fullSrc) {
            lightboxImg.src = fullSrc;
            overlay.style.display = 'flex';
          }
        });
      });

      // Закрытие по крестику
      overlay.querySelector('.close-lightbox').addEventListener('click', () => {
        overlay.style.display = 'none';
      });

      // Закрытие по клику вне картинки
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) {
          overlay.style.display = 'none';
        }
      });
    });
  </script>
